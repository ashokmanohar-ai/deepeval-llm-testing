name: DeepEval LLM tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepeval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 evaluation suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPEVAL_DISABLE_DOTENV: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
      PYTHONUNBUFFERED: "1"
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_MODEL_NAME: ${{ secrets.AZURE_OPENAI_MODEL_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Validate repository and secrets hygiene
        run: python scripts/validate_repository.py

      - name: Lint
        run: ruff check .

      - name: Run deterministic tests
        run: python -m pytest -m "not azure"

      - name: Run DeepEval suite
        run: deepeval test run tests
